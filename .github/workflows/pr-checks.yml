name: Book PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check outline sync
        run: node tools/sync-manuscript.mjs --check

      - name: Validate manuscript structure
        run: node tools/validate-manuscript.mjs

      - name: Check internal links
        run: node tools/check-links.mjs

      - name: Generate heuristic review
        run: |
          mkdir -p artifacts
          node tools/review-manuscript.mjs > artifacts/local-review.json

      - name: Upload heuristic review
        uses: actions/upload-artifact@v4
        with:
          name: local-review
          path: artifacts/local-review.json

  render-preview:
    runs-on: ubuntu-latest
    needs: structural-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Korean font package
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install TinyTeX
        run: quarto install tinytex --update-path

      - name: Render HTML, PDF, and EPUB
        run: quarto render

      - name: Upload rendered book
        uses: actions/upload-artifact@v4
        with:
          name: book-preview
          path: _book

  codex-review:
    runs-on: ubuntu-latest
    needs: structural-checks
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Ensure artifact directory exists
        run: mkdir -p artifacts

      - name: Run Codex review
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/review-manuscript.md
          output-file: artifacts/codex-review.json
          output-schema-file: docs/review-schema.json
          working-directory: .

      - name: Write placeholder review when key is missing
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          cat <<'EOF' > artifacts/codex-review.json
          {
            "structure_pass": false,
            "tone_pass": false,
            "beginner_clarity_score": 0,
            "missing_examples": ["OPENAI_API_KEY secret is not configured."],
            "missing_sources": [],
            "duplicate_topics": [],
            "estimated_pages": 0,
            "next_actions": ["Configure OPENAI_API_KEY to enable Codex review in CI."]
          }
          EOF

      - name: Upload Codex review artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-review
          path: artifacts/codex-review.json

