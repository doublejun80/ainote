services:
  bookshelf:
    image: nginx:1.27-alpine
    container_name: bookshelf
    restart: unless-stopped
    ports:
      - "18081:80"
    volumes:
      - /Volumes/mac_dock/github/ainote/dist/web:/usr/share/nginx/html:ro
      - /Volumes/mac_dock/github/ainote/deploy/bookshelf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
